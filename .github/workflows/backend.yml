name: Backend
# No path filters: required checks must report on every pull request (BAKE-27).
on:
  pull_request:
  push:
    branches: [main]
# Cancel a superseded run when the same branch or PR is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bakeflow_test
          POSTGRES_PASSWORD: bakeflow_test
          POSTGRES_DB: bakeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bakeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAKEFLOW_TEST_DATABASE_URL: postgresql+psycopg://bakeflow_test:bakeflow_test@127.0.0.1:5432/bakeflow_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
        working-directory: backend
      - name: Test
        run: python -m pytest
        working-directory: backend
