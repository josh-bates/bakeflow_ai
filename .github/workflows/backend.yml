name: Backend
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bakeflow_test
          POSTGRES_PASSWORD: bakeflow_test
          POSTGRES_DB: bakeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bakeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAKEFLOW_TEST_DATABASE_URL: postgresql+psycopg://bakeflow_test:bakeflow_test@127.0.0.1:5432/bakeflow_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
